mode: GAME

settings:
  plugin-name-key: nivorabedwars

queue:
  task-name: Bedwars
  min-players: 1
  max-players: 16
  tick-interval-ticks: 20
  verbose-logging: false
  service-reservation-seconds: 20
  map-rotation:
    - bw_map1
    - bw_map2
    - bw_map3

lobby:
  join-item:
    enabled: false
    material: COMPASS
    slot: 4
    name: "&7Bedwars spielen"
    lore:
      - "&7Klicke, um der Warteschlange beizutreten."

cloudnet:
  static-only: true
  static-services:
    - Bedwars-1-1
    - Bedwars-2-1
    - Bedwars-3-1
  service-map-assignments:
    Bedwars-1-1: bw_map1
    Bedwars-2-1: bw_map2
    Bedwars-3-1: bw_map3
  fallback-service: Lobby-1
  commands:
    start: ""
    connect: ""

game:
  service-name: ""
  arena-maps:
    - bw_map1
    - bw_map2
    - bw_map3
  map-id: bw_map1
  start-countdown-seconds: 10
  respawn-delay-seconds: 5
  reset-delay-seconds: 10
  rejoin-reservation-seconds: 30

  respawn-restore:
    swords: true
    armor: true
    tools: true
    bow: true

  disable-hunger: true
  block-item-drops: true

  drops:
    ground-whitelist:
      - IRON_INGOT
      - GOLD_INGOT
      - DIAMOND
      - EMERALD
      - END_STONE
      - TNT
      - "#WOOL"

  friendly-fire: false
  allow-damage-in-waiting: false

  endgame:
    bed-destruction-after-seconds: 900
    sudden-death-after-seconds: 1200

  upgrades:
    costs:
      protection: [3, 6, 9, 12]
      haste: [3, 5]
      forge: [3, 5, 7]
      bow-power: [5, 8, 11]
      bow-punch: [6, 10]

  traps:
    max-active: 2
    rearm-ms: 4000
    alarm:
      glowing-ticks: 100
    blind:
      blindness-ticks: 80
      slowness-ticks: 80
    knock:
      horizontal: 1.15
      vertical: 0.45
    silence:
      duration-ms: 5000

  void-rescue:
    teleport-y-offset: 6.0
    min-safe-y-buffer: 6.0
    upward-velocity: 1.1
    slow-falling-ticks: 120
    platform:
      enabled: true
      lifetime-ticks: 100

  special-items:
    tnt:
      cooldown-ms: 600
      fuse-ticks: 40
      yield: 3.0
      block-radius: 3.8
      damage-multiplier: 1.0
      self-damage-multiplier: 1.0
      no-gravity: false
    breach-tnt:
      cooldown-ms: 750
      fuse-ticks: 42
      yield: 4.2
      block-radius: 5.1
      damage-multiplier: 0.6
      self-damage-multiplier: 0.55
      no-gravity: false
    jump-tnt:
      cooldown-ms: 650
      fuse-ticks: 34
      yield: 2.0
      block-radius: 2.9
      damage-multiplier: 0.55
      self-damage-multiplier: 0.28
      owner-boost-horizontal: 1.55
      owner-boost-vertical: 1.18
      no-gravity: false
    cluster-tnt:
      cooldown-ms: 1400
      fuse-ticks: 36
      yield: 2.8
      block-radius: 3.6
      damage-multiplier: 0.82
      self-damage-multiplier: 0.72
      child-count: 3
      child-fuse-ticks: 14
      child-spread: 0.95
      no-gravity: false
    sticky-tnt:
      cooldown-ms: 850
      fuse-ticks: 42
      yield: 3.35
      block-radius: 4.0
      damage-multiplier: 1.0
      self-damage-multiplier: 0.9
      no-gravity: true
    bridge-egg:
      cooldown-ms: 300
      trail-lifetime-ticks: 60
      max-placed-blocks: 18
      hit-placed-blocks: 8
    fireball:
      cooldown-ms: 600
      damage: 8.0
      damage-radius: 4.5
      block-radius: 3.2
      knockback-horizontal: 1.2
      knockback-vertical: 0.58
      self-damage-multiplier: 0.75
      fire-ticks: 80
    ender-pearl:
      cooldown-ms: 6000
      allow-damage: true

  spectator:
    compass-name: "&bSpectator-Kompass"

  ui:
    sounds:
      bed-break:
        sound: ENTITY_ENDER_DRAGON_GROWL
        volume: 0.35
        pitch: 1.6
      final-kill:
        sound: ENTITY_WITHER_DEATH
        volume: 0.25
        pitch: 1.8
      win:
        sound: UI_TOAST_CHALLENGE_COMPLETE
        volume: 0.7
        pitch: 1.0
      spectator-menu-open:
        sound: UI_BUTTON_CLICK
        volume: 0.7
        pitch: 1.2
      trap-trigger:
        sound: BLOCK_NOTE_BLOCK_BIT
        volume: 0.85
        pitch: 1.4
      void-rescue:
        sound: ITEM_TOTEM_USE
        volume: 0.8
        pitch: 1.25

  performance:
    item-cleanup-interval-seconds: 10
    sidebar-refresh-interval-seconds: 2
    match-end-world-item-scan: false
    shop-click-cooldown-ms: 120
    shop-interact-cooldown-ms: 250

  monitoring:
    enabled: true
    debug: false
    diagnostics-interval-seconds: 20
    warn-cooldown-seconds: 60

  post-match:
    return-to-fallback: true
    delay-seconds: 5

  generators:
    iron:
      material: IRON_INGOT
      tiers:
        stage1:
          after-seconds: 0
          interval-ticks: 1
          cap: 48
        stage2:
          after-seconds: 180
          interval-ticks: 10
          cap: 64

    gold:
      material: GOLD_INGOT
      tiers:
        stage1:
          after-seconds: 0
          interval-ticks: 8
          cap: 16
        stage2:
          after-seconds: 240
